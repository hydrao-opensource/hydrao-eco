name: hydrao_flutter_offline
description: "Hydrao B2C application without internet"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.7.6+35

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # for i18n
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # utils
  path_provider: ^2.1.5 # for db file, folder to store backup, ...
  convert: ^3.1.2
  share_plus: ^12.0.1 # for share app backup
  collection: ^1.19.1
  timeago: ^3.7.1 # for relative date format : il y a ...
  flutter_email_sender: ^7.0.0

  # for i18n
  intl: ^0.20.2

  # for reactive streams
  riverpod: ^3.0.0
  flutter_riverpod: ^3.0.1

  # for BleRepository
  permission_handler: ^12.0.1
  flutter_blue_plus: ^1.36.8
  app_settings: ^6.1.1 # for open settings dialog

  # for DbRepository
  drift: ^2.8.0
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.39

  # widgets
  country_picker: ^2.0.27 # for app settings / choose country
  flutter_spinkit: ^5.2.2 # for loader animations for showerhead card
  file_picker: ^10.3.10 # for pick a backup file
  fl_chart: 1.0.0 # for shower bar graphs
  auto_size_text: ^3.0.0 # for text widget with smart font size

  # crashlytics
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.0.5

  # theme
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.2.3
  package_info_plus: ^9.0.0
  wakelock_plus: ">=1.5.0 <1.6.0"
  device_info_plus: ^12.3.0
  flutter_native_splash: ^2.4.7
  font_awesome_flutter: ^10.9.1
  archive: ^4.0.7
  path: ^1.9.1

  # for external contact form
  flutter_inappwebview: ^6.2.0-beta.3
  image_picker: ^1.2.1

  # api / cloud
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.8.0
  build_runner: ^2.5.4
  source_gen: ^4.2.3
  analyzer: ^9.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  adaptive_icon_foreground_inset: 16 # only available for Android 8.0 devices and above
  adaptive_icon_monochrome: "assets/icon/icon_only.png" # only available for Android 13 devices and above (432x432)
  adaptive_icon_background: "#008DCC" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/icon/icon_only.png" # only available for Android 8.0 devices and above (432x432)
  # web:
  #   generate: false
  # image_path: "path/to/image.png"
  # background_color: "#hexcode"
  # theme_color: "#hexcode"
  # windows:
  #   generate: false
  # image_path: "path/to/image.png"
  # icon_size: 48 # min:48, max:256, default: 48
  # macos:
  #   generate: false
  # image_path: "path/to/image.png"

flutter_native_splash:
  web: false
  fullscreen: false # default=false / hide notif bar on android
  # ---- for all platform except Android 12+
  color: "#008DCC"
  image: assets/splashscreen/splashscreen_logo.png # fit in a circle 640px in diameter
  branding: assets/splashscreen/splashscreen_branding.png
  # ---- for Android 12+ only
  android_12:
    color: "#008DCC"
    image: assets/splashscreen/splashscreen_logo.png # fit in a circle 640px in diameter
    branding: assets/splashscreen/splashscreen_branding.png # must be 800x320 px.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # for i18n
  # - traductions : lib/l10n/intl_xxx.arb
  # - locales supported : lib/l10n/l10n.dart
  # => flutter gen-l10n for generate i18n files
  generate: true

